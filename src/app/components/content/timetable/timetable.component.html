@let data = $timetable | async;

@if (currentLoadingState === LoadingState.Loading) {
  <mat-progress-bar class="progress-bar dark-magenta" mode="indeterminate" />
} @else if (currentLoadingState === LoadingState.Success && data) {
  <div class="main-container split">
    <app-content-block [headerText]="data.summary.header" [bodyTexts]="data.summary.content" />
  </div>

  <div class="main-container split">
    @let time = data.timeline;

    <app-content-block [headerText]="time?.header">
      <mat-stepper class="timeline-stepper" orientation="vertical">
        @for (t of timelineContent; track $index) {
          <mat-step class="content-container">
            <ng-template matStepLabel><span [innerHTML]="t.key"></span></ng-template>
            <ng-template matStepContent><span [innerHTML]="t.value"></span></ng-template>
          </mat-step>
        }
      </mat-stepper>
    </app-content-block>

    <app-content-block [headerText]="data.more.header" [bodyTexts]="data.more.content" />
  </div>
}
